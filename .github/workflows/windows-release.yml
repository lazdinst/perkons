name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm.cmd ci
      - name: Build portable executable
        run: npm.cmd run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem -LiteralPath release -Filter '*-portable.exe' | Select-Object -First 1
          if (-not $file) { throw 'Portable executable was not produced.' }
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content -LiteralPath "$($file.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: Perkons-Windows-x64
          if-no-files-found: error
          path: |
            release/*-portable.exe
            release/*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" release/*-portable.exe release/*.sha256 --verify-tag --title "Pērkons $env:RELEASE_TAG" --generate-notes
